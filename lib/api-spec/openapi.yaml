openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: bot-control
    description: Password-protected bot process controls
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /bot-control/session:
    get:
      operationId: getBotDashboardSession
      tags: [bot-control]
      summary: Check whether the dashboard session is authenticated
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotDashboardSession"
    post:
      operationId: loginBotDashboard
      tags: [bot-control]
      summary: Sign in to the bot dashboard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BotDashboardLoginInput"
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotDashboardSession"
        "401":
          description: Password is incorrect
        "503":
          description: Dashboard password is not configured
    delete:
      operationId: logoutBotDashboard
      tags: [bot-control]
      summary: End the dashboard session
      responses:
        "200":
          description: Session ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotDashboardSession"
  /bot-control/status:
    get:
      operationId: getManagedBotStatus
      tags: [bot-control]
      summary: Get the managed bot process and Discord connection status
      security:
        - botDashboardSession: []
      responses:
        "200":
          description: Current bot status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedBotStatus"
        "401":
          description: Dashboard authentication required
  /bot-control/start:
    post:
      operationId: startManagedBot
      tags: [bot-control]
      summary: Start the managed Discord bot
      security:
        - botDashboardSession: []
      responses:
        "200":
          description: Current bot status after the start request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedBotStatus"
        "401":
          description: Dashboard authentication required
  /bot-control/stop:
    post:
      operationId: stopManagedBot
      tags: [bot-control]
      summary: Stop the managed Discord bot
      security:
        - botDashboardSession: []
      responses:
        "200":
          description: Current bot status after the stop request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedBotStatus"
        "401":
          description: Dashboard authentication required
  /bot-control/logs:
    get:
      operationId: getBotLogs
      tags: [bot-control]
      summary: Get recent redacted bot process logs
      security:
        - botDashboardSession: []
      responses:
        "200":
          description: Recent log entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotLogResponse"
        "401":
          description: Dashboard authentication required
  /bot-control/connection:
    get:
      operationId: getBotConnection
      tags: [bot-control]
      summary: Get Discord gateway and Minecraft connection information
      security:
        - botDashboardSession: []
      responses:
        "200":
          description: Current connection information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotConnection"
        "401":
          description: Dashboard authentication required
  /bot-control/usage:
    get:
      operationId: getBotUsage
      tags: [bot-control]
      summary: Get recent bot profiler samples
      security:
        - botDashboardSession: []
      responses:
        "200":
          description: Current and recent profiler samples
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotUsageResponse"
        "401":
          description: Dashboard authentication required
components:
  securitySchemes:
    botDashboardSession:
      type: apiKey
      in: cookie
      name: bot_dashboard_session
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    BotDashboardSession:
      type: object
      properties:
        authenticated:
          type: boolean
      required: [authenticated]
    BotDashboardLoginInput:
      type: object
      properties:
        password:
          type: string
          minLength: 1
          writeOnly: true
      required: [password]
    ManagedBotStatus:
      type: object
      properties:
        state:
          type: string
          enum: [stopped, starting, running, stopping, error]
        gatewayConnected:
          type: boolean
        processId:
          type: [integer, "null"]
        startedAt:
          type: [string, "null"]
          format: date-time
        uptimeSeconds:
          type: integer
          minimum: 0
        lastExitCode:
          type: [integer, "null"]
        lastError:
          type: [string, "null"]
      required:
        - state
        - gatewayConnected
        - processId
        - startedAt
        - uptimeSeconds
        - lastExitCode
        - lastError
    BotLogEntry:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        source:
          type: string
          enum: [stdout, stderr]
        level:
          type: string
          enum: [info, warn, error]
        message:
          type: string
      required: [timestamp, source, level, message]
    BotLogResponse:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/BotLogEntry"
      required: [entries]
    DiscordConnection:
      type: object
      properties:
        gatewayConnected:
          type: boolean
        latencyMs:
          type: [number, "null"]
        shards:
          type: array
          items:
            type: integer
        botUsername:
          type: [string, "null"]
        connectedAt:
          type: [string, "null"]
          format: date-time
      required: [gatewayConnected, latencyMs, shards, botUsername, connectedAt]
    MinecraftConnection:
      type: object
      properties:
        address:
          type: string
        host:
          type: string
        port:
          type: integer
        statusMode:
          type: string
          enum: [on-demand]
        statusCommand:
          type: string
        connectionCommand:
          type: string
        note:
          type: string
      required:
        - address
        - host
        - port
        - statusMode
        - statusCommand
        - connectionCommand
        - note
    BotConnection:
      type: object
      properties:
        discord:
          $ref: "#/components/schemas/DiscordConnection"
        minecraft:
          $ref: "#/components/schemas/MinecraftConnection"
      required: [discord, minecraft]
    ProfilerMemory:
      type: object
      properties:
        heapUsed:
          type: integer
          minimum: 0
        heapTotal:
          type: integer
          minimum: 0
        rss:
          type: integer
          minimum: 0
        heapUtilization:
          type: number
          minimum: 0
      required: [heapUsed, heapTotal, rss, heapUtilization]
    ProfilerEventLoop:
      type: object
      properties:
        meanMs:
          type: number
          minimum: 0
        maxMs:
          type: number
          minimum: 0
      required: [meanMs, maxMs]
    ProfilerPressure:
      type: object
      properties:
        memory:
          type: boolean
        cpu:
          type: boolean
        eventLoop:
          type: boolean
      required: [memory, cpu, eventLoop]
    ProfilerCache:
      type: object
      properties:
        guilds:
          type: integer
          minimum: 0
        guildMembers:
          type: integer
          minimum: 0
        users:
          type: integer
          minimum: 0
        channels:
          type: integer
          minimum: 0
        messages:
          type: integer
          minimum: 0
      required: [guilds, guildMembers, users, channels, messages]
    ProfilerMods:
      type: object
      properties:
        cachePruner:
          type: boolean
        adaptiveCooldown:
          type: boolean
      required: [cachePruner, adaptiveCooldown]
    ProfilerThresholds:
      type: object
      properties:
        cpuPercent:
          type: number
          minimum: 0
        heapUtilization:
          type: number
          minimum: 0
        eventLoopLagMs:
          type: number
          minimum: 0
      required: [cpuPercent, heapUtilization, eventLoopLagMs]
    ProfilerSnapshot:
      type: object
      properties:
        sampledAt:
          type: string
          format: date-time
        cpuPercent:
          type: number
          minimum: 0
        memory:
          $ref: "#/components/schemas/ProfilerMemory"
        eventLoop:
          $ref: "#/components/schemas/ProfilerEventLoop"
        gatewayLatencyMs:
          type: [number, "null"]
        pressure:
          $ref: "#/components/schemas/ProfilerPressure"
        cooldownMultiplier:
          type: number
          minimum: 1
        cache:
          $ref: "#/components/schemas/ProfilerCache"
        mods:
          $ref: "#/components/schemas/ProfilerMods"
        thresholds:
          $ref: "#/components/schemas/ProfilerThresholds"
      required:
        - sampledAt
        - cpuPercent
        - memory
        - eventLoop
        - gatewayLatencyMs
        - pressure
        - cooldownMultiplier
        - cache
        - mods
        - thresholds
    BotUsageResponse:
      type: object
      properties:
        current:
          oneOf:
            - $ref: "#/components/schemas/ProfilerSnapshot"
            - type: "null"
        history:
          type: array
          items:
            $ref: "#/components/schemas/ProfilerSnapshot"
        retentionMinutes:
          type: integer
          minimum: 1
      required: [current, history, retentionMinutes]

