kind = "web"
previewPath = "/"
title = "Mendive Bot Dashboard"
description = "A private control dashboard for the Mendive SMP Discord bot. View its live process and Discord gateway status, and securely start or stop the bot."
version = "1.0.0"
id = "artifacts/bot-dashboard"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25712

[services.development]
run = "pnpm --filter @workspace/bot-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bot-dashboard", "run", "build" ]
serve = "static"
publicDir = "artifacts/bot-dashboard/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25712"
BASE_PATH = "/"
